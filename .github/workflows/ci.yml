name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    env:
      # Tidak dipakai saat build (route DB bersifat dynamic), hanya agar
      # tooling tidak error saat membaca konfigurasi.
      DATABASE_URL: postgresql://dps:dps@localhost:5432/dps_portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  db:
    name: db
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dps
          POSTGRES_PASSWORD: dps
          POSTGRES_DB: dps_portal
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://dps:dps@localhost:5432/dps_portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Verifikasi migration jalan dari awal (tanpa error) + seed idempoten.
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      # Seed diulang untuk membuktikan idempoten (tidak menduplikasi data).
      - run: npm run db:seed
      # Invarian DB: audit_logs append-only (UPDATE/DELETE/TRUNCATE ditolak),
      # FK menolak referensi tak dikenal, seed tidak terduplikasi.
      - run: npm run db:verify
