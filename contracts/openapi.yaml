openapi: 3.1.0
info:
  title: DPS Portal API
  version: 0.1.0
  description: |
    Contract-first API untuk Portal Chapter DPS (Modular Monolith, API-First).

    Aturan kontrak:
    - Semua endpoint berada di bawah prefix `/api/v1`.
    - Success response memakai envelope `{ "data": ... }` (list) atau objek DTO langsung.
    - Error response selalu memakai envelope `ApiErrorBody` dengan `request_id`.
    - Shared TypeScript types: `src/shared/types/api.ts` (sinkron manual dengan file ini).

    Konvensi endpoint list (wajib untuk semua endpoint list):
    - Envelope sukses: `{ "data": [...], "meta": { page, pageSize, total, totalPages } }`.
    - Pagination: `page` (1-based, default 1), `pageSize` (default 10, maksimal 100).
    - Sort: `sort=<field>:asc|desc` dengan whitelist field per endpoint.
    - Filter: query params biasa, hanya field yang terdaftar per endpoint yang
      dipakai; nilai divalidasi (mis. boolean harus "true"/"false").
    - Input tidak valid → `400` dengan `ApiErrorBody` dan `details` berupa
      daftar `{ field, message }`.
    - Template untuk menambah kontrak modul baru: `contracts/module-template.yaml`.
  license:
    name: Proprietary
servers:
  - url: /api/v1
    description: Same-origin (Next.js BFF)
tags:
  - name: health
    description: Liveness/readiness
  - name: auth
    description: Autentikasi & sesi (implementasi mengikuti keputusan DEC-03)
  - name: identity
    description: User & RBAC

paths:
  /health:
    get:
      tags: [health]
      summary: Liveness check + status koneksi database
      operationId: getHealth
      responses:
        "200":
          description: Service sehat dan database terhubung
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Service terdegradasi (database tidak terhubung)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /users:
    get:
      tags: [identity]
      summary: Daftar user beserta role-nya (CONTOH ACUAN endpoint list)
      description: >-
        Endpoint contoh terdokumentasi penuh untuk acuan modul lain:
        pagination + sort + filter tervalidasi, envelope `{ data, meta }`,
        dan seluruh skenario error (request/response/error).
      operationId: listUsers
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Sort"
        - name: q
          in: query
          required: false
          description: Pencarian bebas pada `name` / `email` (case-insensitive).
          schema:
            type: string
            maxLength: 100
          examples:
            cariAni:
              value: ani
        - name: isActive
          in: query
          required: false
          description: Filter status aktif user. Harus `"true"` atau `"false"`.
          schema:
            type: string
            enum: ["true", "false"]
      responses:
        "200":
          description: Daftar user (terpaginasi)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
              examples:
                halamanPertama:
                  summary: Halaman pertama, terurut nama
                  value:
                    data:
                      - id: 3f6c0d2e-8a41-4b6f-9c2f-1d2b3c4d5e6f
                        email: admin@dps.local
                        name: Admin DPS
                        isActive: true
                        roles:
                          - key: ADMIN
                            name: Administrator
                        createdAt: "2026-10-26T12:51:49.000Z"
                    meta:
                      page: 1
                      pageSize: 10
                      total: 2
                      totalPages: 1
        "400":
          description: Input tidak valid (pagination/sort/filter)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
              examples:
                queryTidakValid:
                  summary: Dua kesalahan validasi sekaligus
                  value:
                    error:
                      code: BAD_REQUEST
                      message: Query tidak valid
                      details:
                        - field: page
                          message: harus bilangan bulat >= 1
                        - field: sort
                          message: "format <field>:asc|desc dengan field salah satu dari: createdAt, name, email"
                    request_id: 6f0c7a4e-3f6b-4b6a-9d1e-0a1b2c3d4e5f
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"

  /auth/login:
    post:
      tags: [auth]
      summary: Tukar kredensial menjadi sesi (endpoint dasar auth/RBAC)
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Sesi dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout:
    post:
      tags: [auth]
      summary: Akhiri sesi berjalan
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Sesi diakhiri

  /auth/me:
    get:
      tags: [auth]
      summary: User pada sesi berjalan (dipakai guard RBAC di UI)
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profil user sesi saat ini
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDto"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        Token sesi/JWT. Sumber autentikasi final (Enterprise SSO vs credentials)
        menunggu keputusan DEC-03 — lihat README §Asumsi.

  responses:
    BadRequest:
      description: Input tidak valid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorBody"
    Unauthorized:
      description: Tidak terautentikasi / sesi berakhir
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorBody"
    Internal:
      description: Kesalahan server tak terduga (detail internal tidak dibocorkan)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorBody"

  parameters:
    Page:
      name: page
      in: query
      required: false
      description: Nomor halaman, 1-based.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      description: Jumlah item per halaman.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    Sort:
      name: sort
      in: query
      required: false
      description: >-
        Urutan `<field>:asc|desc`. Whitelist field per endpoint (untuk
        `/users`: `createdAt`, `name`, `email`). Default `createdAt:desc`.
      schema:
        type: string
        pattern: "^[a-zA-Z]+:(asc|desc)$"
      examples:
        namaAsc:
          value: name:asc

  schemas:
    HealthResponse:
      type: object
      required: [status, db, version, timestamp]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        db:
          type: string
          enum: [up, down]
        version:
          type: string
        timestamp:
          type: string
          format: date-time

    RoleDto:
      type: object
      required: [key, name]
      properties:
        key:
          type: string
          examples: [ADMIN]
        name:
          type: string

    UserDto:
      type: object
      required: [id, email, name, isActive, roles, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        isActive:
          type: boolean
        roles:
          type: array
          items:
            $ref: "#/components/schemas/RoleDto"
        createdAt:
          type: string
          format: date-time

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    SessionDto:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/UserDto"

    ApiErrorBody:
      type: object
      required: [error, request_id]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              examples: [BAD_REQUEST, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, CONFLICT, INTERNAL]
            message:
              type: string
            details: {}
        request_id:
          type: string

    ListMeta:
      type: object
      required: [page, pageSize, total, totalPages]
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 1

    UserListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/UserDto"
        meta:
          $ref: "#/components/schemas/ListMeta"
