# Database lokal untuk pengembangan.
# Pakai: `docker compose up -d db` (hanya database; app jalan via `npm run dev`).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dps
      POSTGRES_PASSWORD: dps
      POSTGRES_DB: dps_portal
    ports:
      - "5432:5432"
    volumes:
      - dps_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dps -d dps_portal"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dps_pgdata:
